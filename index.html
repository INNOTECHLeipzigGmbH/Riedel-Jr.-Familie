<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Familienboard</title>
<style>
:root {
  --ground: #F2F4F1; --surface: #FFFFFF; --ink: #17201C; --muted: #55605A; --line: #DDE2DD; --line-soft: #E8ECE8;
  --accent: #1B6B57; --accent-dark: #124B3D; --accent-soft: #E3F0EB; --accent-ink: #14604D;
  --dringend-dot: #C4452A; --dringend-bg: #FBE9E3; --dringend-fg: #A3361A;
  --wartet-dot: #C98A0B;   --wartet-bg: #FBF0D5;   --wartet-fg: #7A5200;
  --laeuft-dot: #1B6B57;   --laeuft-bg: #E3F0EB;   --laeuft-fg: #14604D;
  --erledigt-dot: #8A948E; --erledigt-bg: #E9ECE9; --erledigt-fg: #4A554F;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--ground); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.4; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
[hidden] { display: none !important; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 16px 32px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand-mark { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
.brand h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
.brand small { display: block; font-size: 13px; color: var(--muted); }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--ground); border-radius: 12px; }
.seg button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(23,32,28,.12); }
.btn { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-dark); }
.btn.outline { border-color: var(--accent); color: var(--accent); }
.btn.danger { color: var(--dringend-fg); border-color: var(--dringend-dot); }
.btn:disabled { opacity: .55; cursor: wait; }
.avatar { width: 44px; height: 44px; border-radius: 22px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }

main { padding: 28px 32px 64px; display: flex; flex-direction: column; gap: 26px; max-width: 1500px; margin: 0 auto; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; }
.stat .n { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; flex-shrink: 0; }
.stat b { display: block; font-size: 15px; }
.stat small { color: var(--muted); font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; }
.panel h2, .sec-title h2 { margin: 0; font-size: 18px; }
.sec-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec-title span { font-size: 13px; color: var(--muted); }
.due-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.due { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); text-align: left; width: 100%; }
.due:hover { border-color: var(--accent); }
.due .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.due .t { font-size: 15px; font-weight: 600; line-height: 1.3; }
.due .m { font-size: 13px; color: var(--muted); }
.chip { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.empty { color: var(--muted); font-size: 14px; padding: 4px 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 12px; }
.card-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card-head h3 { margin: 0; font-size: 17px; }
.card-head small { font-size: 13px; color: var(--muted); }
.card-head .grow { margin-right: auto; min-width: 0; }
.people { display: flex; align-items: center; }
.people span { width: 28px; height: 28px; border-radius: 14px; border: 2px solid #fff; margin-left: -8px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
.thema { padding: 12px 0; border-top: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 4px; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.thema:hover .tt { color: var(--accent); }
.thema .l1 { display: flex; align-items: center; gap: 10px; }
.thema .dot { width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; }
.thema .tt { font-size: 15px; font-weight: 600; margin-right: auto; min-width: 0; }
.pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.thema .l2 { display: flex; gap: 10px; padding-left: 20px; font-size: 13px; color: var(--muted); }
.thema .l2 .s { margin-right: auto; min-width: 0; }
.card-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; min-height: 36px; padding: 0 4px; }
.link-btn:hover { text-decoration: underline; }

/* Dialoge */
.modal-bg { position: fixed; inset: 0; background: rgba(23,32,28,.55); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 16px; width: 640px; max-width: 100%; display: flex; flex-direction: column; margin: auto 0; }
.modal.wide { width: 760px; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 18px; margin-right: auto; }
.modal-body { padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; }
.modal-foot { padding: 14px 24px; border-top: 1px solid var(--line); background: #F7F9F7; border-radius: 0 0 16px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.modal-foot .sp { margin-right: auto; font-size: 13px; color: var(--muted); }
.x-btn { min-width: 44px; min-height: 44px; border: 0; background: none; font-size: 22px; color: var(--muted); border-radius: 10px; }
.x-btn:hover { background: var(--ground); }
.status-seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 4px; background: var(--ground); border-radius: 12px; }
.status-seg button { min-height: 44px; border: 2px solid transparent; border-radius: 9px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; }
.status-seg button.on { font-weight: 700; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } .status-seg { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .lbl { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea, .inp { min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); width: 100%; }
.field textarea { min-height: 96px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .inp:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.val { font-size: 15px; font-weight: 600; min-height: 24px; white-space: pre-wrap; }
.links { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lchip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-weight: 600; text-decoration: none; color: var(--ink); max-width: 100%; }
.lchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
.lchip button { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 0 2px; }
.lchip button:hover { color: var(--dringend-fg); }
.addlink { display: flex; gap: 8px; flex-wrap: wrap; }
.addlink input { flex: 1 1 140px; }
.verlauf { display: flex; flex-direction: column; gap: 10px; border-left: 2px solid var(--line); padding-left: 16px; }
.verlauf .v { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.verlauf small { color: var(--muted); font-size: 12px; }
.komm { display: flex; gap: 8px; }
.komm input { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { min-height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: #6B756F; font-size: 13px; font-weight: 600; }
.chips button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.person { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.person .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.person .row .inp { flex: 1 1 160px; width: auto; }
.person select { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--surface); }
.linkbox { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 14px 16px; background: var(--accent-soft); border-radius: 12px; }
.linkbox input { flex: 1 1 260px; min-height: 44px; border: 1px solid var(--accent); border-radius: 10px; padding: 0 10px; background: #fff; font-size: 13px; }
.linkbox p { margin: 0; flex-basis: 100%; font-size: 13px; color: #1F4D40; }
.roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.roles div { padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; color: var(--muted); }
.roles b { display: block; font-size: 14px; color: var(--ink); margin-bottom: 2px; }
@media (max-width: 560px) { .roles { grid-template-columns: 1fr; } }

#msg { max-width: 760px; margin: 60px auto; background: var(--surface); border: 1px solid var(--dringend-dot); border-radius: 14px; padding: 22px 26px; color: var(--muted); line-height: 1.6; }
#msg h2 { margin: 0 0 8px; font-size: 18px; color: var(--dringend-fg); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; z-index: 300; box-shadow: 0 4px 16px rgba(0,0,0,.25); }

/* Einfache Ansicht (Mitmachen / Ansehen) */
body.simple { font-size: 18px; }
.simple-wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100vh; }
.simple-head { padding: 28px 20px 20px; background: var(--accent); color: #fff; }
.simple-head small { font-size: 15px; font-weight: 600; opacity: .9; }
.simple-head h1 { margin: 6px 0; font-size: 30px; line-height: 1.15; }
.simple-head p { margin: 0; font-size: 17px; opacity: .95; }
.simple-body { padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.simple-body h2 { margin: 8px 0 0; font-size: 18px; color: var(--muted); }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.scard .when { align-self: flex-start; font-size: 15px; font-weight: 700; padding: 4px 12px; border-radius: 99px; }
.scard .tt { font-size: 22px; font-weight: 700; line-height: 1.25; }
.scard .tx { font-size: 17px; color: #3F4A44; line-height: 1.4; white-space: pre-wrap; }
.sbtns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.sbtns.one { grid-template-columns: 1fr; }
.sbtn { min-height: 56px; border-radius: 14px; font-size: 18px; font-weight: 700; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); }
.sbtn.primary { background: var(--accent); color: #fff; }
.sbtn:disabled { opacity: .55; }
.scard.info { padding: 14px 16px; gap: 8px; }
.scard.info .tt { font-size: 18px; }
.scard.info .tx { font-size: 15px; }
</style>
</head>
<body>

<div id="msg" hidden></div>
<div id="app" hidden></div>
<div id="modal-root"></div>

<script>
const SUPABASE_URL = "https://beszfzvxtfwdzimixdbo.supabase.co";
const SUPABASE_KEY = "sb_publishable_onY7q5GNCGOxkEuzEOySDA_XyIqR6Rw";
const TOKEN_KEY = "familienboard_zugang";

const ST = {
  dringend: { label: "Handlungsbedarf", rank: 0 },
  wartet:   { label: "Wartet", rank: 1 },
  laeuft:   { label: "Läuft", rank: 2 },
  erledigt: { label: "Erledigt", rank: 3 },
};
const ROLLEN = { inhaber: "Inhaber", bearbeiten: "Bearbeiten", mitmachen: "Mitmachen", ansehen: "Ansehen" };
const WDH = { "": "Keine", monatlich: "Jeden Monat", vierteljaehrlich: "Jedes Quartal", halbjaehrlich: "Halbjährlich", jaehrlich: "Jedes Jahr" };
const ICONS = {
  haus: "M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6",
  schild: "M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z",
  leute: "M9 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M17.5 11a2.5 2.5 0 1 0 0-5M18 14.2c2.2.4 3.5 2.1 3.5 5.8",
  auto: "M4 17v-5l2-5h12l2 5v5M3 17h18v3H3zM7 14.5h.01M17 14.5h.01",
  beleg: "M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6",
  tasche: "M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0",
};
const ICON_NAMES = { haus: "Haus", schild: "Schutz", leute: "Familie", auto: "Auto", beleg: "Beleg", tasche: "Einkauf" };
const AVATAR_COLORS = ["#17201C", "#1B6B57", "#B4501F", "#6B4FA0", "#2A6FA8", "#8A5A00"];

let TOKEN = null;
let DATA = { me: null, bereiche: [], themen: [], personen: [] };
let scope = "alle";
let expanded = new Set();     // Bereich-IDs mit allen Themen
let showDone = new Set();     // Bereich-IDs mit sichtbaren erledigten
let lastLoad = 0;

/* ---------- Helfer ---------- */
const $ = (s, r = document) => r.querySelector(s);
function esc(s) { return (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function todayStart() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function parseDate(s) { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function daysUntil(s) { const d = parseDate(s); return d ? Math.round((d - todayStart()) / 86400000) : null; }
function fmtDate(s) { const d = parseDate(s); return d ? d.toLocaleDateString("de-DE", { day: "numeric", month: "short", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" }) : ""; }
function fmtDateLong(s) { const d = parseDate(s); return d ? d.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "long" }) : ""; }
function fmtTs(ts) { const d = new Date(ts); return d.toLocaleString("de-DE", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
function rel(s) {
  const n = daysUntil(s);
  if (n == null) return "";
  if (n < 0) return n === -1 ? "seit gestern überfällig" : `seit ${-n} Tagen überfällig`;
  if (n === 0) return "heute";
  if (n === 1) return "morgen";
  return `in ${n} Tagen`;
}
function dueTone(s) {
  const n = daysUntil(s);
  if (n == null) return "laeuft";
  return n <= 7 ? "dringend" : (n <= 14 ? "wartet" : "laeuft");
}
function tone(k) { return `background:var(--${k}-bg);color:var(--${k}-fg)`; }
function personName(id) { const p = DATA.personen.find(x => x.id === id); return p ? p.name : ""; }
function initial(name) { return (name || "?").trim().charAt(0).toUpperCase(); }
function avatarColor(id) { const i = DATA.personen.findIndex(p => p.id === id); return AVATAR_COLORS[(i < 0 ? 0 : i) % AVATAR_COLORS.length]; }
const canEdit = () => ["inhaber", "bearbeiten"].includes(DATA.me.rolle);
const canAct = () => DATA.me.rolle !== "ansehen";
const isOwner = () => DATA.me.rolle === "inhaber";
const isSimple = () => ["mitmachen", "ansehen"].includes(DATA.me.rolle);
function svgIcon(name, color = "#1B6B57", size = 22) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[name] || ICONS.haus}"/></svg>`;
}

/* ---------- Zugang und Schnittstelle ---------- */
function readToken() {
  const z = new URLSearchParams(location.search).get("z");
  let stored = null;
  try { stored = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  if (z) {
    try { localStorage.setItem(TOKEN_KEY, z); history.replaceState(null, "", location.pathname + location.hash); } catch (e) { /* Token bleibt dann in der Adresse */ }
    return z;
  }
  return stored;
}
async function rpc(name, args) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
    body: JSON.stringify({ p_token: TOKEN, ...args }),
  });
  if (!res.ok) {
    let body = {}; try { body = await res.json(); } catch (e) {}
    const err = new Error(body.message || `HTTP ${res.status}`);
    err.unauthorized = /unauthorized/.test(body.message || "");
    err.forbidden = /forbidden/.test(body.message || "");
    throw err;
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
function showMsg(title, html) {
  $("#app").hidden = true;
  const m = $("#msg"); m.hidden = false;
  m.innerHTML = `<h2>${esc(title)}</h2><div>${html}</div>`;
}
async function reload(silent) {
  try {
    DATA = await rpc("fb_laden", {});
    lastLoad = Date.now();
    $("#msg").hidden = true; $("#app").hidden = false;
    render();
  } catch (err) {
    if (err.unauthorized) {
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
      showMsg("Zugangslink ungültig", "Dieser Link ist nicht (mehr) gültig. Bitte frag den Inhaber des Boards nach einem neuen Zugangslink.");
    } else if (!silent) {
      showMsg("Verbindung fehlgeschlagen", esc(err.message));
    }
  }
}
function mergeThema(t) {
  const i = DATA.themen.findIndex(x => x.id === t.id);
  if (i >= 0) Object.assign(DATA.themen[i], t); else DATA.themen.push(t);
}

/* ---------- Auswertung ---------- */
function visibleThemen() {
  return DATA.themen.filter(t => scope === "alle" || t.zustaendig_id === DATA.me.id);
}
function sortThemen(list) {
  return [...list].sort((a, b) => (ST[a.status].rank - ST[b.status].rank) || ((a.faellig || "9999") < (b.faellig || "9999") ? -1 : 1) || a.titel.localeCompare(b.titel, "de"));
}
function bereichName(id) { const b = DATA.bereiche.find(x => x.id === id); return b ? b.name : ""; }

/* ---------- Rendering (Vollansicht) ---------- */
function render() {
  document.body.classList.toggle("simple", isSimple());
  document.title = "Familienboard";
  $("#app").innerHTML = isSimple() ? renderSimple() : renderFull();
}
function renderFull() {
  const th = visibleThemen();
  const cnt = k => th.filter(t => t.status === k).length;
  const year = new Date().getFullYear();
  const doneYear = th.filter(t => t.status === "erledigt" && t.erledigt_am && t.erledigt_am.startsWith(String(year))).length;
  const stats = [
    ["dringend", cnt("dringend"), "Handlungsbedarf", "liegt bei mir oder uns"],
    ["wartet", cnt("wartet"), "Wartet", "auf Antwort von anderen"],
    ["laeuft", cnt("laeuft"), "Läuft", "nichts zu tun"],
    ["erledigt", doneYear, "Erledigt", "in diesem Jahr"],
  ];
  const due = th.filter(t => t.status !== "erledigt" && t.faellig && daysUntil(t.faellig) <= 30)
    .sort((a, b) => a.faellig < b.faellig ? -1 : 1).slice(0, 8);

  return `
  <header class="top">
    <div class="brand">
      <div class="brand-mark">${svgIcon("haus", "#fff", 22)}</div>
      <div><h1>Familienboard</h1><small>Was läuft, was wartet, was ansteht</small></div>
    </div>
    <div class="seg" role="group" aria-label="Filter">
      <button type="button" data-act="scope" data-v="alle" class="${scope === "alle" ? "on" : ""}">Alle</button>
      <button type="button" data-act="scope" data-v="meine" class="${scope === "meine" ? "on" : ""}">Meine</button>
    </div>
    ${isOwner() ? `<button type="button" class="btn outline" data-act="zugriff">Zugriff und Bereiche</button>` : ""}
    ${canEdit() && DATA.bereiche.length ? `<button type="button" class="btn primary" data-act="neu">+ Neues Thema</button>` : ""}
    <div class="avatar" title="${esc(DATA.me.name)}" aria-label="Angemeldet als ${esc(DATA.me.name)}">${esc(initial(DATA.me.name))}</div>
  </header>
  <main>
    <section class="stats" aria-label="Zusammenfassung">
      ${stats.map(([k, n, l, s]) => `<div class="stat"><div class="n" style="${tone(k)}">${n}</div><div><b>${l}</b><small>${s}</small></div></div>`).join("")}
    </section>
    <section class="panel" aria-label="Demnächst fällig">
      <div class="sec-title"><h2>Demnächst fällig</h2><span>alle Bereiche, nächste 30 Tage</span></div>
      ${due.length ? `<div class="due-grid">${due.map(t => `
        <button type="button" class="due" data-act="open" data-id="${t.id}">
          <div class="row"><span class="chip" style="${tone(dueTone(t.faellig))}">${esc(rel(t.faellig))}</span><span class="m">${esc(fmtDateLong(t.faellig))}</span></div>
          <div class="t">${esc(t.titel)}</div>
          <div class="m">${esc(bereichName(t.bereich_id))}${t.zustaendig_id ? " · " + esc(personName(t.zustaendig_id)) : ""}</div>
        </button>`).join("")}</div>` : `<div class="empty">Nichts fällig in den nächsten 30 Tagen.</div>`}
    </section>
    <section aria-label="Bereiche" style="display:flex;flex-direction:column;gap:16px">
      <div class="sec-title"><h2>Bereiche</h2><span>${isOwner() ? "jeder Bereich lässt sich einzeln teilen" : ""}</span></div>
      ${DATA.bereiche.length ? `<div class="cards">${DATA.bereiche.map(b => renderCard(b, th)).join("")}</div>`
        : `<div class="panel"><div class="empty">${isOwner() ? "Noch keine Bereiche. Lege sie unter „Zugriff und Bereiche“ an." : "Für dich ist noch kein Bereich freigegeben."}</div></div>`}
    </section>
  </main>`;
}
function renderCard(b, th) {
  const all = th.filter(t => t.bereich_id === b.id);
  const open = sortThemen(all.filter(t => t.status !== "erledigt"));
  const done = sortThemen(all.filter(t => t.status === "erledigt"));
  const isExp = expanded.has(b.id), showD = showDone.has(b.id);
  const list = [...(isExp ? open : open.slice(0, 4)), ...(showD ? done : [])];
  const c = k => all.filter(t => t.status === k).length;
  const zahlen = [c("dringend") && `${c("dringend")} dringend`, c("wartet") && `${c("wartet")} wartet`, c("laeuft") && `${c("laeuft")} läuft`].filter(Boolean).join(" · ") || (all.length ? "alles erledigt" : "noch leer");
  const viewers = DATA.personen.filter(p => p.rolle === "inhaber" || (p.bereiche || []).includes(b.id));
  const people = isOwner() ? viewers : [];
  return `
  <article class="card">
    <div class="card-head">
      <div class="card-icon">${svgIcon(b.icon)}</div>
      <div class="grow"><h3>${esc(b.name)}</h3><small>${esc(zahlen)}</small></div>
      <div class="people" aria-hidden="true">${people.map(p => `<span title="${esc(p.name)}" style="background:${avatarColor(p.id)}">${esc(initial(p.name))}</span>`).join("")}</div>
    </div>
    <div>${list.length ? list.map(t => `
      <button type="button" class="thema" data-act="open" data-id="${t.id}">
        <div class="l1"><span class="dot" style="background:var(--${t.status}-dot)"></span><span class="tt">${esc(t.titel)}</span><span class="pill" style="${tone(t.status)}">${ST[t.status].label}</span></div>
        <div class="l2"><span class="s">${esc(t.naechster_schritt || "")}</span><span>${t.status === "erledigt" ? "" : esc(t.faellig ? fmtDate(t.faellig) : "")}</span></div>
      </button>`).join("") : `<div class="empty">Noch keine Themen.</div>`}</div>
    <div class="card-foot">
      ${open.length > 4 ? `<button type="button" class="link-btn" data-act="expand" data-id="${b.id}">${isExp ? "Weniger anzeigen" : `Alle ${open.length} Themen anzeigen`}</button>` : ""}
      ${done.length ? `<button type="button" class="link-btn" data-act="done" data-id="${b.id}">${showD ? "Erledigte ausblenden" : `${done.length} erledigt anzeigen`}</button>` : ""}
      ${canEdit() ? `<button type="button" class="link-btn" data-act="neu" data-id="${b.id}" style="margin-left:auto">+ Thema</button>` : ""}
    </div>
  </article>`;
}

/* ---------- Einfache Ansicht ---------- */
function renderSimple() {
  const me = DATA.me;
  const open = DATA.themen.filter(t => t.status !== "erledigt");
  const mine = sortThemen(open.filter(t => t.zustaendig_id === me.id));
  const others = sortThemen(open.filter(t => t.zustaendig_id !== me.id));
  const card = (t, isMine) => {
    const tx = [t.naechster_schritt, t.notiz].filter(Boolean).join("\n\n");
    const when = t.faellig ? `<span class="when" style="${tone(dueTone(t.faellig))}">${esc(fmtDateLong(t.faellig))}</span>` : "";
    return `<div class="scard ${isMine ? "" : "info"}">
      <div style="display:flex;flex-direction:column;gap:6px">${when}<div class="tt">${esc(t.titel)}</div>${tx ? `<div class="tx">${esc(tx)}</div>` : ""}
      ${isMine ? "" : `<div class="tx" style="font-size:14px"><b>${ST[t.status].label}</b>${t.zustaendig_id ? " · " + esc(personName(t.zustaendig_id)) : ""}</div>`}</div>
      ${canAct() ? `<div class="sbtns ${isMine ? "" : "one"}">
        ${isMine ? `<button type="button" class="sbtn primary" data-act="s-done" data-id="${t.id}">Erledigt</button>` : ""}
        <button type="button" class="sbtn" data-act="s-ask" data-id="${t.id}">Rückfrage</button></div>` : ""}
    </div>`;
  };
  return `<div class="simple-wrap">
    <div class="simple-head"><small>Familienboard</small><h1>Hallo ${esc(me.name)}</h1>
      <p>${mine.length ? "Das steht für dich an. Alles andere erledigen wir." : "Für dich ist gerade nichts offen."}</p></div>
    <div class="simple-body">
      ${mine.map(t => card(t, true)).join("")}
      ${others.length ? `<h2>Zur Information</h2>${others.map(t => card(t, false)).join("")}` : ""}
      ${!mine.length && !others.length ? `<div class="scard"><div class="tx">Im Moment gibt es nichts Offenes.</div></div>` : ""}
    </div></div>`;
}

function openModal(html, wide) {

  $("#mbg").addEventListener("mousedown", e => { if (e.target.id === "mbg") closeModal(); });
}
function closeModal() { $("#modal-root").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

let draft = null; // { id|null, bereich_id, ...felder } im offenen Thema-Dialog
async function openThema(id, bereichId) {
  const t = id ? DATA.themen.find(x => x.id === id) : null;
  draft = t ? JSON.parse(JSON.stringify(t)) : { id: null, bereich_id: bereichId || (DATA.bereiche[0] || {}).id, titel: "", status: "laeuft", naechster_schritt: "", faellig: "", zustaendig_id: "", firma: "", wiederholung: "", notiz: "", links: [] };

function collectDraft() {
  const g = id => { const el = $("#" + id); return el ? el.value : null; };
  const set = (k, id) => { const v = g(id); if (v !== null) draft[k] = v; };
  set("titel", "f-titel"); set("naechster_schritt", "f-schritt"); set("faellig", "f-faellig"); set("zustaendig_id", "f-zust");
  set("firma", "f-firma"); set("wiederholung", "f-wdh"); set("notiz", "f-notiz"); set("bereich_id", "f-bereich");
}
async function saveDraft() {
  collectDraft();
  const d = draft;
  const data = { titel: d.titel, naechster_schritt: d.naechster_schritt || "", faellig: d.faellig || "", zustaendig_id: d.zustaendig_id || "", firma: d.firma || "", wiederholung: d.wiederholung || "", notiz: d.notiz || "", links: d.links || [] };
  if (!d.id) { data.bereich_id = d.bereich_id; data.status = d.status; }
  try {
    const t = await rpc("fb_thema_speichern", { p_id: d.id, p_data: data });
    mergeThema(t); closeModal(); render(); toast(d.id ? "Gespeichert" : "Thema angelegt");
  } catch (e) { alert("Speichern fehlgeschlagen: " + e.message); }
}
async function setStatus(id, status) {
  try {
    const t = await rpc("fb_thema_speichern", { p_id: id, p_data: { status } });
    mergeThema(t); render();
    return t;
  } catch (e) { alert("Status konnte nicht geändert werden: " + e.message); return null; }
}

function personDraftBereiche(pid) { return Array.from(document.querySelectorAll(`[data-pb="${pid}"].on`)).map(b => b.dataset.b); }

/* Rückfrage (einfache Ansicht) */

/* ---------- Ereignisse ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act], [data-pb], [data-nb]");
  if (!el) return;
  if (el.dataset.pb || el.dataset.nb) {
    el.classList.toggle("on");
    if (el.dataset.nb) { newPerson = newPerson || { name: "", rolle: "mitmachen", bereiche: [] }; const id = el.dataset.b; const s = new Set(newPerson.bereiche); s.has(id) ? s.delete(id) : s.add(id); newPerson.bereiche = [...s]; }
    return;
  }
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case "scope": scope = el.dataset.v; render(); break;
    case "expand": expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); break;
    case "done": showDone.has(id) ? showDone.delete(id) : showDone.add(id); render(); break;
    case "open": openThema(id); break;
    case "neu": openThema(null, id); break;
    case "close": closeModal(); break;
    case "zugriff": newPerson = null; drawZugriff(); break;
    case "d-status": {
      const k = el.dataset.v;
      if (draft.id) {
        collectDraft();
        const had = draft.wiederholung;
        const t = await setStatus(draft.id, k);
        if (t) { const keep = { ...draft }; draft = JSON.parse(JSON.stringify(t)); if (canEdit()) { Object.assign(draft, { titel: keep.titel, naechster_schritt: keep.naechster_schritt, notiz: keep.notiz, firma: keep.firma, zustaendig_id: keep.zustaendig_id, wiederholung: keep.wiederholung }); } drawThema(); try { const v = await rpc("fb_verlauf_laden", { p_thema: draft.id }); const box = $("#verlauf"); if (box) box.innerHTML = verlaufHtml(v); } catch (er) {} if (k === "erledigt") toast(had ? "Erledigt, neuer Termin gesetzt" : "Abgehakt"); }
      } else { collectDraft(); draft.status = k; drawThema(); }
      break;
    }
    case "d-addlink": {
      collectDraft();
      const url = ($("#f-lurl").value || "").trim(); let name = ($("#f-lname").value || "").trim();
      if (!url) { $("#f-lurl").focus(); break; }
      const full = /^https?:\/\//i.test(url) ? url : "https://" + url;
      draft.links = [...(draft.links || []), { name: name || full.replace(/^https?:\/\//, "").slice(0, 40), url: full }];
      drawThema(); break;
    }
    case "d-dellink": { e.preventDefault(); collectDraft(); draft.links = draft.links.filter((_, i) => i !== Number(el.dataset.i)); drawThema(); break; }
    case "d-komm": {
      const inp = $("#f-komm"); const txt = (inp.value || "").trim(); if (!txt) break;
      try { await rpc("fb_kommentar", { p_thema: draft.id, p_text: txt }); inp.value = ""; const v = await rpc("fb_verlauf_laden", { p_thema: draft.id }); $("#verlauf").innerHTML = verlaufHtml(v); } catch (er) { alert("Kommentar konnte nicht gesendet werden: " + er.message); }
      break;
    }
    case "d-save": el.disabled = true; await saveDraft(); el.disabled = false; break;
    case "d-del": {
      if (!confirm(`Thema „${draft.titel}“ wirklich löschen?`)) break;
      try { await rpc("fb_thema_loeschen", { p_id: draft.id }); DATA.themen = DATA.themen.filter(t => t.id !== draft.id); closeModal(); render(); toast("Gelöscht"); } catch (er) { alert("Löschen fehlgeschlagen: " + er.message); }
      break;
    }
    case "copy": copyFrom(el.dataset.t); break;
    case "np-reset": newPerson = null; drawZugriff(); break;
    case "np-create": {
      const name = ($("#np-name").value || "").trim(); const rolle = $("#np-rolle").value;
      if (!name) { $("#np-name").focus(); break; }
      const bereiche = Array.from(document.querySelectorAll("[data-nb].on")).map(b => b.dataset.b);
      el.disabled = true;
      try {
        const r = await rpc("fb_person_speichern", { p_id: null, p_name: name, p_rolle: rolle, p_bereiche: bereiche });
        await reload(true); newPerson = { name, rolle, bereiche, token: r.token }; drawZugriff();
      } catch (er) { alert("Einladung fehlgeschlagen: " + er.message); el.disabled = false; }
      break;
    }
    case "p-save": {
      const name = $(`[data-name="${id}"]`).value, rolle = $(`[data-role="${id}"]`).value, bereiche = personDraftBereiche(id);
      try { await rpc("fb_person_speichern", { p_id: id, p_name: name, p_rolle: rolle, p_bereiche: bereiche }); await reload(true); drawZugriff(); toast("Gespeichert"); } catch (er) { alert("Speichern fehlgeschlagen: " + er.message); }
      break;
    }
    case "p-link": {
      if (!confirm("Der bisherige Link dieser Person wird damit ungültig. Neuen Link erzeugen?")) break;
      try {
        const tok = await rpc("fb_person_token_neu", { p_id: id });
        const base = location.origin + location.pathname;
        $("#plink-" + id).innerHTML = `<div class="linkbox"><input readonly id="pl-${id}" value="${esc(base + "?z=" + tok)}" aria-label="Zugangslink"><button type="button" class="btn primary" data-act="copy" data-t="pl-${id}">Link kopieren</button><p>Nur jetzt sichtbar. Persönlich weitergeben.</p></div>`;
      } catch (er) { alert("Link konnte nicht erzeugt werden: " + er.message); }
      break;
    }
    case "p-del": {
      if (!confirm("Diese Person entfernen? Ihr Zugangslink funktioniert danach nicht mehr.")) break;
      try { await rpc("fb_person_loeschen", { p_id: id }); await reload(true); drawZugriff(); toast("Entfernt"); } catch (er) { alert("Entfernen fehlgeschlagen: " + er.message); }
      break;
    }
    case "b-new": {
      const name = ($("#nb-name").value || "").trim(); if (!name) { $("#nb-name").focus(); break; }
      try { await rpc("fb_bereich_speichern", { p_id: null, p_name: name, p_icon: $("#nb-icon").value }); await reload(true); drawZugriff(); toast("Bereich angelegt"); } catch (er) { alert("Anlegen fehlgeschlagen: " + er.message); }
      break;
    }
    case "b-save": {
      try { await rpc("fb_bereich_speichern", { p_id: id, p_name: $(`[data-bname="${id}"]`).value, p_icon: $(`[data-bicon="${id}"]`).value }); await reload(true); drawZugriff(); toast("Gespeichert"); } catch (er) { alert("Speichern fehlgeschlagen: " + er.message); }
      break;
    }
    case "b-del": {
      const n = DATA.themen.filter(t => t.bereich_id === id).length;
      if (!confirm(`Bereich „${bereichName(id)}“ mit ${n} Thema${n === 1 ? "" : "en"} wirklich löschen?`)) break;
      try { await rpc("fb_bereich_loeschen", { p_id: id }); await reload(true); drawZugriff(); toast("Gelöscht"); } catch (er) { alert("Löschen fehlgeschlagen: " + er.message); }
      break;
    }
    case "s-done": {
      el.disabled = true;
      const t = await setStatus(id, "erledigt"); if (t) toast("Danke, erledigt!"); else el.disabled = false;
      break;
    }
    case "s-ask": askDialog(id); break;
    case "s-send": {
      const txt = ($("#ask-text").value || "").trim(); if (!txt) { $("#ask-text").focus(); break; }
      el.disabled = true;
      try { await rpc("fb_kommentar", { p_thema: id, p_text: "Rückfrage: " + txt }); closeModal(); toast("Nachricht gesendet"); } catch (er) { alert("Nachricht konnte nicht gesendet werden: " + er.message); el.disabled = false; }
      break;
    }
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "np-rolle" && newPerson) newPerson.rolle = e.target.value;
});
document.addEventListener("input", e => {
  if (e.target.id === "np-name") { newPerson = newPerson || { name: "", rolle: "mitmachen", bereiche: [] }; newPerson.name = e.target.value; }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && TOKEN && !$("#modal-root").firstChild && Date.now() - lastLoad > 30000) reload(true);
});

/* ---------- Start ---------- */
(async function init() {
  TOKEN = readToken();
  if (!TOKEN) {
    showMsg("Zugangslink fehlt", "Diese Seite ist privat. Bitte öffne sie über den persönlichen Link, den du bekommen hast. Er endet auf <code>?z=…</code>");
    return;
  }
  await reload(false);
})();
</script>
</body>
